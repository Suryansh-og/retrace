<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retrace Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0e14;
            color: #f5f7fa;
            padding: 30px;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        header {
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 36px;
            letter-spacing: -1px;
        }

        header p {
            color: #8b93a1;
            margin-top: 8px;
            font-size: 15px;
        }

        /* SUMMARY */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: #151922;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid #242936;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #3a4150;
        }

        .card h3 {
            color: #8b93a1;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .card .value {
            font-size: 34px;
            font-weight: bold;
        }

        /* SECTIONS */

        .section {
            background: #151922;
            border: 1px solid #242936;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 22px;
        }

        .section h2 {
            margin-bottom: 20px;
            font-size: 20px;
            letter-spacing: -0.3px;
        }

        /* APPLICATION USAGE */

        .usage-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4px;
            border-bottom: 1px solid #242936;
        }

        .usage-row:last-child {
            border-bottom: none;
        }

        .usage-row span:first-child {
            font-weight: 600;
        }

        .usage-row span:last-child {
            color: #9ca3af;
            font-family: monospace;
        }

        /* SESSIONS */

        .sessions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .session {
            background: #10131a;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #242936;
        }

        .session-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .session-info {
            color: #8b93a1;
            font-size: 13px;
            line-height: 1.7;
        }

        /* TIMELINE */

        .timeline {
            display: flex;
            flex-direction: column;
        }

        .timeline-item {
            display: grid;
            grid-template-columns: 85px 20px 1fr;
            gap: 15px;
            padding: 13px 0;
        }

        .timeline-time {
            color: #8b93a1;
            font-family: monospace;
            font-size: 12px;
            padding-top: 2px;
        }

        .timeline-line {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .timeline-line::before {
            content: "";
            width: 9px;
            height: 9px;
            background: #f5f7fa;
            border-radius: 50%;
            margin-top: 4px;
            z-index: 2;
        }

        .timeline-line::after {
            content: "";
            position: absolute;
            top: 13px;
            width: 1px;
            height: calc(100% + 13px);
            background: #343a48;
        }

        .timeline-item:last-child .timeline-line::after {
            display: none;
        }

        .timeline-app {
            font-weight: bold;
            font-size: 14px;
        }

        .timeline-context {
            color: #8b93a1;
            font-size: 13px;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timeline-session {
            color: #626b7a;
            font-size: 11px;
            margin-top: 5px;
        }

        /* SIGNALS */

        .signal {
            padding: 15px;
            margin-bottom: 10px;
            background: #10131a;
            border-radius: 10px;
            border: 1px solid #242936;
        }

        .signal-pattern {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .signal-details {
            color: #8b93a1;
            font-size: 13px;
        }

        /* TRACE */

        .trace-panel {
            margin-top: 22px;
            padding: 22px;
            border: 1px solid #343a48;
            border-radius: 12px;
            background: #0e1117;
        }

        .trace-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .trace-section {
            margin-bottom: 22px;
        }

        .trace-section-title {
            color: #8b93a1;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .trace-event {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 15px;
            padding: 9px 0;
            border-bottom: 1px solid #242936;
        }

        .trace-time {
            color: #8b93a1;
            font-family: monospace;
            font-size: 12px;
        }

        .trace-app {
            font-weight: bold;
            font-size: 14px;
        }

        .trace-context {
            color: #8b93a1;
            font-size: 13px;
            margin-top: 4px;
        }

        .trace-target {
            border: 1px solid #f5f7fa;
            border-radius: 10px;
            padding: 14px;
            margin: 10px 0 22px;
            background: #151922;
        }

        .trace-button {
            margin-top: 12px;
            padding: 7px 14px;
            border: 1px solid #414857;
            border-radius: 7px;
            background: #181c25;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .trace-button:hover {
            background: #272d38;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            body {
                padding: 18px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .sessions {
                grid-template-columns: 1fr;
            }

            .timeline-item {
                grid-template-columns: 70px 15px 1fr;
                gap: 10px;
            }

            .timeline-context {
                white-space: normal;
            }
        }
    </style>
</head>


<body>

    <div class="container">

        <header>
            <h1>Retrace</h1>
            <p>Digital Behavior Intelligence Dashboard</p>
        </header>


        <!-- SUMMARY -->

        <div class="cards">

            <div class="card">
                <h3>TOTAL EVENTS</h3>
                <div class="value" id="total-events">-</div>
            </div>

            <div class="card">
                <h3>TOTAL SESSIONS</h3>
                <div class="value" id="total-sessions">-</div>
            </div>

            <div class="card">
                <h3>BEHAVIOR SIGNALS</h3>
                <div class="value" id="total-signals">-</div>
            </div>

        </div>


        <!-- APPLICATION USAGE -->

        <div class="section">

            <h2>Application Usage</h2>

            <div id="usage">
                Loading...
            </div>

        </div>


        <div class="section">

            <h2>Activity Timeline</h2>

            <div id="timeline">
                Loading...
            </div>

        </div>


        <!-- RECENT SESSIONS -->

        <div class="section">

            <h2>Recent Sessions</h2>

            <div id="sessions">
                Loading...
            </div>

        </div>


        <!-- BEHAVIOR SIGNALS -->

        <div class="section">

            <h2>Behavior Signals</h2>

            <div id="signals">
                Loading...
            </div>

            <div class="section">

                <div class="section-title">
                    Event Relationships
                </div>

                <div id="relationships-container">
                    Loading relationships...
                </div>

            </div>

            <!-- TRACE PANEL -->

            <div id="trace-panel" class="trace-panel" style="display: none;"></div>

        </div>


        <script>

            async function loadDashboard() {

                try {

                    // SUMMARY

                    const summaryResponse =
                        await fetch("/api/summary");

                    const summary =
                        await summaryResponse.json();

                    document.getElementById("total-events")
                        .textContent = summary.total_events;

                    document.getElementById("total-sessions")
                        .textContent = summary.total_sessions;

                    document.getElementById("total-signals")
                        .textContent = summary.behavior_signals;


                    // USAGE

                    const usageResponse =
                        await fetch("/api/usage");

                    const usage =
                        await usageResponse.json();

                    const usageContainer =
                        document.getElementById("usage");

                    usageContainer.innerHTML = "";

                    usage.forEach(item => {

                        const row =
                            document.createElement("div");

                        row.className = "usage-row";

                        row.innerHTML = `
                <span>${item.application}</span>
                <span>${item.duration}s</span>
            `;

                        usageContainer.appendChild(row);

                    });

                    // TIMELINE

                    const timelineResponse =
                        await fetch("/api/timeline");

                    const timeline =
                        await timelineResponse.json();

                    timeline.reverse();

                    const timelineContainer =
                        document.getElementById("timeline");

                    timelineContainer.innerHTML = "";

                    timeline.forEach(event => {

                        const item =
                            document.createElement("div");

                        item.className = "timeline-item";

                        let activityLabel = "Application switch";
                        let activityIcon = "🔄";

                        if (event.activity_type === "file_change") {
                            activityLabel = "File changed";
                            activityIcon = "📄";
                        }

                        else if (event.activity_type === "folder_change") {
                            activityLabel = "Folder changed";
                            activityIcon = "📁";
                        }

                        item.innerHTML = `

                        <div class="timeline-time">
                            ${event.timestamp}
                         </div>

                        <div class="timeline-line"></div>

                        <div>

                            <div class="timeline-app">
                                ${activityIcon} ${event.application}
                            </div>

                            <div class="timeline-context">
                                ${activityLabel} · ${event.context}
                            </div>

                            <div class="timeline-session">
                                Session ${event.session_id}
                            </div>

                        </div>

                `;

                        timelineContainer.appendChild(item);

                    });


                    // SESSIONS

                    const sessionsResponse =
                        await fetch("/api/sessions");

                    const sessions =
                        await sessionsResponse.json();

                    const sessionsContainer =
                        document.getElementById("sessions");

                    sessionsContainer.innerHTML = "";

                    sessions.forEach(session => {

                        const card =
                            document.createElement("div");

                        card.className = "session";

                        card.innerHTML = `
                            <div class="session-title">
                                Session ${session.id}
                            </div>

                            <div class="session-info">
                                Start: ${session.start_time}
                                <br>
                                End: ${session.end_time}
                                <br>
                                Duration: ${Number(session.duration).toFixed(1)}s
                                <br>
                                Events: ${session.event_count}
                            </div>

                            <button
                                class="trace-button"
                                onclick="showSession(${session.id})"
                            >
                                View Session
                            </button>
                        `;

                        sessionsContainer.appendChild(card);

                    });




                    // SIGNALS

                    const signalsResponse =
                        await fetch("/api/signals");

                    const signals =
                        await signalsResponse.json();

                    const signalsContainer =
                        document.getElementById("signals");

                    signalsContainer.innerHTML = "";

                    signals.forEach(signal => {

                        const item =
                            document.createElement("div");

                        item.className = "signal-item";

                        item.innerHTML = `

                <div class="signal-pattern">
                    🔁 ${signal.pattern}
                </div>

                <div class="signal-details">
                    Session ${signal.session_id}
                    · Observed ${signal.count} time${signal.count !== 1 ? "s" : ""}
                    · ${signal.time_before_switch}s before switch
                    · ${signal.time_before_return}s before return
                </div>

                <button
                    class="trace-button"
                    onclick="showTrace(${signal.event_id})"
                    >
                    Trace
                </button>

                    `;

                        signalsContainer.appendChild(item);

                    });



                }


                catch (error) {

                    console.error(
                        "Dashboard error:",
                        error
                    );

                }

            }

            loadDashboard();

            async function showSession(sessionId) {

                try {

                    const response = await fetch(`/api/sessions/${sessionId}/events`);

                    const events = await response.json();

                    const sessionEvents = events;

                    const panel = document.getElementById("trace-panel");

                    panel.style.display = "block";

                    panel.innerHTML = `
                        <div class="trace-title">
                            Session ${sessionId}
                        </div>

                        <div class="trace-section">

                            <div class="trace-section-title">
                                Session Timeline
                            </div>

                            ${
                                sessionEvents.length === 0
                                ? "<p>No events found for this session.</p>"
                                : sessionEvents.map(event => `
                                        <div class="trace-event">

                                            <div class="trace-time">
                                                ${event.timestamp}
                                            </div>

                                            <div>

                                                <div class="trace-app">
                                                    ${event.application}
                                                </div>

                                                <div class="trace-context">
                                                    ${event.context || "No context"}
                                                </div>

                                                <div class="trace-context">
                                                    ${event.activity_type}
                                                </div>

                                            </div>

                                    </div>
                                `).join("")
                            }

                        </div>
                    `;

                    panel.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                }
                catch (error) {

                    console.error("Session error:", error);

                }
            }
            async function loadRelationships() {

                try {

                    const response =
                        await fetch("/api/relationships");

                    const relationships =
                        await response.json();

                    const container =
                        document.getElementById("relationships-container");

                    container.innerHTML = relationships
                        .slice(0, 20)
                        .map(r => `
                            <div class="relationship-item">

                                <div class="relationship-events">
                                    Event ${r.from_event}
                                    → Event ${r.to_event}
                                </div>

                                <div class="relationship-type">
                                    ${r.type}
                                </div>

                                <div class="relationship-gap">
                                    ${r.time_gap}s
                                </div>

                            </div>
                        `)
                        .join("");

                }

                catch (error) {

                    console.error(
                        "Relationship error:",
                        error
                    );

                }
            }
            setTimeout(() => {
                loadRelationships();
            }, 1000);

            async function showTrace(eventId) {

                try {

                    const response =
                        await fetch(`/api/trace/${eventId}`);

                    const data =
                        await response.json();

                    const panel =
                        document.getElementById("trace-panel");

                    panel.style.display = "block";

                    panel.innerHTML = `

                    <div class="trace-title">
                        Backward Trace
                    </div>

                    <div class="trace-section">

                        <div class="trace-section-title">
                            Before
                        </div>

                        ${renderTraceEvents(data.before)}

                    </div>

                    <div class="trace-target">

                        <div class="trace-section-title">
                            Target Event
                        </div>

                        ${renderTraceEvent(data.target)}

                    </div>

                    <div class="trace-section">

                        <div class="trace-section-title">
                            After
                        </div>

                        ${renderTraceEvents(data.after)}

                    </div>

                `;

                    panel.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                }

                catch (error) {

                    console.error(
                        "Trace error:",
                        error
                    );

                }

            }

            async function viewSession(sessionId) {

                const response =
                    await fetch(`/api/sessions/${sessionId}`);

                const events =
                    await response.json();

                console.log("Session:", sessionId);
                console.log("Events:", events);

            }
            function renderTraceEvents(events) {

                if (!events || events.length === 0) {

                    return `
                    <div class="trace-context">
                        No events found.
                    </div>
                `;

                }

                return events
                    .map(event => renderTraceEvent(event))
                    .join("");

            }


            function renderTraceEvent(event) {

                return `

                <div class="trace-event">

                    <div class="trace-time">
                        ${event.timestamp}
                    </div>

                    <div>

                        <div class="trace-app">
                            ${event.application}
                        </div>

                        <div class="trace-context">
                            ${event.context}
                        </div>

                    </div>

                </div>
            
            `;

            }

        </script>

</body>

</html>
