<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retrace Dashboard</title>

    
</head>


<body>

    <div class="container">

        <header>
            <h1>Retrace</h1>
            <p>Digital Behavior Intelligence Dashboard</p>
        </header>

        <!-- QUERY -->

        <div class="section">

            <h2>Ask Retrace</h2>

            <div style="display: flex; gap: 10px;">

                <input
                    type="text"
                    id="query-input"
                    placeholder="Ask something like: What happened around event 251?"
                    style="
                        flex: 1;
                        padding: 12px;
                        border-radius: 8px;
                        border: 1px solid #343a48;
                        background: #10131a;
                        color: white;
                        font-size: 14px;
                    "
                >

                <button
                    class="trace-button"
                    onclick="runQuery()"
                >
                    Search
                </button>

            </div>

            <div
                id="query-result"
                class="trace-panel"
                style="display: none;"
            ></div>

        </div>

        <!-- SUMMARY -->

        <div class="cards">

            <div class="card">
                <h3>TOTAL EVENTS</h3>
                <div class="value" id="total-events">-</div>
            </div>

            <div class="card">
                <h3>TOTAL SESSIONS</h3>
                <div class="value" id="total-sessions">-</div>
            </div>

            <div class="card">
                <h3>BEHAVIOR SIGNALS</h3>
                <div class="value" id="total-signals">-</div>
            </div>

        </div>


        <!-- APPLICATION USAGE -->

        <div class="section">

            <h2>Application Usage</h2>

            <div id="usage">
                Loading...
            </div>

        </div>


        <div class="section">

            <h2>Activity Timeline</h2>

            <div id="timeline">
                Loading...
            </div>

        </div>


        <!-- RECENT SESSIONS -->

        <div class="section">

            <h2>Recent Sessions</h2>

            <div id="sessions">
                Loading...
            </div>

        </div>


        <!-- BEHAVIOR SIGNALS -->

        <div class="section">

            <h2>Behavior Signals</h2>

            <div id="signals">
                Loading...
            </div>

            <div class="section">

                <div class="section-title">
                    Event Relationships
                </div>

                <div id="relationships-container">
                    Loading relationships...
                </div>

            </div>

            <!-- TRACE PANEL -->

            <div id="trace-panel" class="trace-panel" style="display: none;"></div>

    </div>/div>


        

</body>

</html>
