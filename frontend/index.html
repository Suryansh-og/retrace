<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retrace Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #ffffff;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
        }

        header p {
            color: #9ca3af;
            margin-top: 8px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #181b23;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #292d38;
        }

        .card h3 {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 32px;
            font-weight: bold;
        }

        .section {
            background: #181b23;
            border: 1px solid #292d38;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .usage-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #292d38;
        }

        .usage-row:last-child {
            border-bottom: none;
        }

        .signal {
            padding: 15px;
            margin-bottom: 10px;
            background: #20242e;
            border-radius: 8px;
        }

        .signal-pattern {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .signal-info {
            color: #9ca3af;
            font-size: 13px;
        }

        .sessions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .session {
            background: #20242e;
            padding: 15px;
            border-radius: 8px;
        }

        .session-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .session-info {
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .sessions {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <header>
        <h1>Retrace</h1>
        <p>Digital Behavior Intelligence Dashboard</p>
    </header>


    <!-- SUMMARY -->

    <div class="cards">

        <div class="card">
            <h3>TOTAL EVENTS</h3>
            <div class="value" id="total-events">-</div>
        </div>

        <div class="card">
            <h3>TOTAL SESSIONS</h3>
            <div class="value" id="total-sessions">-</div>
        </div>

        <div class="card">
            <h3>BEHAVIOR SIGNALS</h3>
            <div class="value" id="total-signals">-</div>
        </div>

    </div>


    <!-- APPLICATION USAGE -->

    <div class="section">

        <h2>Application Usage</h2>

        <div id="usage">
            Loading...
        </div>

    </div>


    <!-- SESSIONS -->

    <div class="section">

        <h2>Recent Sessions</h2>

        <div class="sessions" id="sessions">
            Loading...
        </div>

    </div>


    <!-- BEHAVIOR SIGNALS -->

    <div class="section">

        <h2>Behavior Signals</h2>

        <div id="signals">
            Loading...
        </div>

    </div>

</div>


<script>

async function loadDashboard() {

    try {

        // SUMMARY

        const summaryResponse =
            await fetch("/api/summary");

        const summary =
            await summaryResponse.json();

        document.getElementById("total-events")
            .textContent = summary.total_events;

        document.getElementById("total-sessions")
            .textContent = summary.total_sessions;

        document.getElementById("total-signals")
            .textContent = summary.behavior_signals;


        // USAGE

        const usageResponse =
            await fetch("/api/usage");

        const usage =
            await usageResponse.json();

        const usageContainer =
            document.getElementById("usage");

        usageContainer.innerHTML = "";

        usage.forEach(item => {

            const row =
                document.createElement("div");

            row.className = "usage-row";

            row.innerHTML = `
                <span>${item.application}</span>
                <span>${item.duration}s</span>
            `;

            usageContainer.appendChild(row);

        });


        // SESSIONS

        const sessionsResponse =
            await fetch("/api/sessions");

        const sessions =
            await sessionsResponse.json();

        const sessionsContainer =
            document.getElementById("sessions");

        sessionsContainer.innerHTML = "";

        sessions.forEach(session => {

            const card =
                document.createElement("div");

            card.className = "session";

            card.innerHTML = `
                <div class="session-title">
                    Session ${session.id}
                </div>

                <div class="session-info">
                    Duration: ${session.duration}s
                    <br>
                    Events: ${session.event_count}
                </div>
            `;

            sessionsContainer.appendChild(card);

        });


        // SIGNALS

        const signalsResponse =
            await fetch("/api/signals");

        const signals =
            await signalsResponse.json();

        const signalsContainer =
            document.getElementById("signals");

        signalsContainer.innerHTML = "";

        if (signals.length === 0) {

            signalsContainer.innerHTML =
                "<p>No behavior signals detected.</p>";

        } else {

            signals.forEach(signal => {

                const element =
                    document.createElement("div");

                element.className = "signal";

                element.innerHTML = `

                    <div class="signal-pattern">
                        🔁 ${signal.pattern}
                    </div>

                    <div class="signal-info">
                        Session ${signal.session_id}
                        <br>
                        Before switch:
                        ${signal.time_before_switch}s
                        <br>
                        Before return:
                        ${signal.time_before_return}s
                    </div>

                `;

                signalsContainer.appendChild(element);

            });

        }

    }

    catch (error) {

        console.error(
            "Dashboard error:",
            error
        );

    }

}


loadDashboard();

</script>

</body>

</html>
